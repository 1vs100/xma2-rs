[package]
name = "xma2-rs"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust XMA2 and xWMA audio decoder (WMA Pro / WMA v1/v2 cores ported from FFmpeg, LGPL-2.1+)"
license = "LGPL-2.1-or-later"

[dependencies]
# XMA2 encoding through wmv9's WMA Pro encoder. wmv9 is GPL-3.0-or-later,
# so builds with this feature are too.
wmv9 = { git = "https://github.com/1vs100/wmv9", branch = "perf", default-features = false, optional = true }

[features]
encode = ["dep:wmv9"]
